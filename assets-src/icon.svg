    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd457"/>
      <stop offset="100%" stop-color="#ffc02b"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" fill="url(#bg)"/>
  <!-- yumuşak suluboya lekesi (Çizio tasarım dili) -->
