  <!-- gülen yüz -->
  <g transform="translate(60 61) rotate(-3) translate(-60 -61)">
    <rect x="23" y="24" width="74" height="74" rx="21" fill="url(#face)" stroke="#2b2250" stroke-width="5"/>
    <circle cx="46.5" cy="55" r="6" fill="#2b2250"/>
