<!-- Sayio uygulama simgesi (tam kaplama; iOS/Android köşeleri kendi yuvarlar). -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 120 120">
  <defs>
    <radialGradient id="bg" cx="30%" cy="22%" r="95%">
      <stop offset="0%" stop-color="#ff8a62"/>
